services:
  postgres:
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card_local_only
      POSTGRES_DB: card
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U card -d card']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://card:card_local_only@postgres:5432/card
      NODE_ENV: production
      PORT: 3000
      DEFAULT_PROFILE_SLUG: nikita-makeev
      PRISMA_QUERY_LOG: 'false'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://localhost:3000/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 60s
  test-postgres:
    image: postgres:17.7-bookworm
    profiles: ['test']
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card_local_only
      POSTGRES_DB: card_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U card -d card_test']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
